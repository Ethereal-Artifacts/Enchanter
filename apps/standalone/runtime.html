								<span class="corner corner--tl"><span class="corner__stroke"></span></span>
								<span class="corner corner--bl"><span class="corner__stroke"></span></span>
							</span>
							<span class="field__rail">
								<span class="corner corner--tr"><span class="corner__stroke"></span></span>
								<span class="corner corner--br"><span class="corner__stroke"></span></span>
							</span>
						</span>
						<select class="field__input" id="spell-select"></select>
					</div>
				</div>
				</div>
				<div id="element-row"></div>
				<div id="begin-slot" class="env-line" data-boot-line="13"></div>
			</div>

		</div>
	</div>

	<div id="info-slot"></div>
	<div id="enchanter-info" hidden role="dialog" aria-label="What is this?" lang="en"></div>
	<div id="offline-top-links">
				<p class="env-license">
					<a href="{{ENCHANTER_LICENSE_HREF}}" aria-label="{{ENCHANTER_LICENSE_TEXT}}">{{ENCHANTER_LICENSE_TEXT}}</a>
				</p>
	</div>
	<div id="offline-links"><div id="offline-locale"></div></div>
	<div id="offline-promotion" hidden></div>
	<div id="enchantment-hud" hidden>
		<div id="hud-actions" class="row"></div>
	</div>

	<div id="completion">
		<p id="completion-intention"></p>
		<div id="return-slot"></div>
	</div>

	<div class="glass parameters-panel" id="parametersPanel">
		<div class="glass-inner"></div>
	</div>
	<div class="glass macros-panel" id="macrosPanel">
		<div class="glass-inner"></div>
	</div>
</body>
</html>
